<!doctype html>
<html lang="ja">
<head>
	<meta charset="utf-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
	<title>宿泊学習　生活係の仕事</title>
	<meta name="description" content="宿泊学習「生活係の仕事」説明動画の確認用プレビュー" />
	<style>
		:root {
			--bg: #f4f9ff;
			--card: #ffffff;
			--text: #1d2b4f;
			--sub: #4a5b80;
			--blue: #1c6fd6;
			--green: #17a35a;
			--shadow: rgba(20, 50, 100, 0.16);
		}
		* {
			box-sizing: border-box;
		}
		html,
		body {
			margin: 0;
			padding: 0;
		}
		body {
			min-height: 100vh;
			min-height: 100dvh;
			background: linear-gradient(180deg, #ffffff 0%, var(--bg) 60%, #e3efff 100%);
			color: var(--text);
			font-family: 'BIZ UDPGothic', 'Hiragino Sans', 'Hiragino Kaku Gothic ProN', 'Noto Sans JP', Meiryo, sans-serif;
			display: flex;
			flex-direction: column;
			align-items: center;
			padding: max(16px, env(safe-area-inset-top)) max(16px, env(safe-area-inset-right))
				max(16px, env(safe-area-inset-bottom)) max(16px, env(safe-area-inset-left));
		}
		header {
			width: 100%;
			max-width: 1280px;
			text-align: center;
			margin: 12px 0 20px;
		}
		h1 {
			margin: 0;
			font-size: clamp(24px, 6vw, 44px);
			font-weight: 700;
			letter-spacing: 0.04em;
			line-height: 1.3;
		}
		h1 .accent {
			color: var(--green);
		}
		.badge {
			display: inline-block;
			margin-top: 10px;
			padding: 4px 14px;
			border-radius: 999px;
			background: var(--blue);
			color: #fff;
			font-size: clamp(12px, 3.2vw, 15px);
			font-weight: 700;
		}
		main {
			width: 100%;
			max-width: 1280px;
		}
		.player {
			background: var(--card);
			border-radius: 18px;
			padding: 8px;
			box-shadow: 0 10px 30px var(--shadow);
			border-bottom: 6px solid var(--blue);
		}
		video {
			display: block;
			width: 100%;
			height: auto;
			aspect-ratio: 16 / 9;
			background: #000;
			border-radius: 12px;
		}
		.note {
			margin: 16px 4px 0;
			color: var(--sub);
			font-size: clamp(13px, 3.4vw, 15px);
			line-height: 1.7;
		}
		.note a {
			color: var(--blue);
		}
		@media (max-width: 600px) {
			.player {
				padding: 4px;
				border-radius: 12px;
			}
			video {
				border-radius: 8px;
			}
		}
	</style>
</head>
<body>
	<header>
		<h1>宿泊学習　<span class="accent">生活係の仕事</span></h1>
		<span class="badge">確認用プレビュー</span>
	</header>

	<main>
		<div class="player">
			<video controls playsinline preload="metadata" poster="poster.jpg">
				<source src="preview.mp4" type="video/mp4" />
				お使いのブラウザでは動画を再生できません。
				<a href="preview.mp4">preview.mp4 を直接開く</a>
			</video>
		</div>
		<p class="note">
			ナレーションと映像・字幕の同期を確認するためのプレビュー動画です（1280×720・約3分20秒）。<br />
			音が出ない場合は、iPhone の消音スイッチ（マナーモード）と音量を確認してください。
			動画が再生できない場合は <a href="preview.mp4">こちら</a> から直接開けます。
		</p>
	</main>
</body>
</html>
